

services:
  # Servidor Nginx (O porteiro)
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "443:443"
 
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

  # Back-end (NestJS)
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    restart: always
    
    command: >
      sh -c "npm install && 
             npx prisma generate && 
             npm run start:dev"
    ports:
      - "3000:3000"
      - "5555:5555"
    volumes:
      - ./backend:/app        
      - /app/node_modules

  # Front-end (Next.js)
  frontend:
    build: ./frontend
    restart: always
    ports:
      - "3001:3000"
    environment:               
      - NODE_ENV=development        
      - WATCHPACK_POLLING=true          
      - CHOKIDAR_USEPOLLING=true
      
    volumes:
      - ./frontend:/app         
      - /app/node_modules
       - /app/.next
    command: npm run dev

  # Banco de Dados
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
